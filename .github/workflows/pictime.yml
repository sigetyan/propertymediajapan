name: pictime-import
on:
  push:
    branches: [import/pictime]
    paths: [_import/pictime*.py, .github/workflows/pictime.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: python _import/pictime.py
      - run: |
          if [ -f _import/pictime_dl.py ]; then python _import/pictime_dl.py; fi
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add _import; git commit -m "Pic-Time import" || echo nothing; git push
