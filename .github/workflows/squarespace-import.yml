name: squarespace-import
on:
  push:
    branches: [import/squarespace]
    paths: [_import/scrape.py, .github/workflows/squarespace-import.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 _import/scrape.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add _import
          git commit -m "Squarespace import: pages and images" || echo nothing
          git push
